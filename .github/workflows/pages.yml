name: Deploy yr_portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Verify static portfolio
        run: node tests/site-smoke.mjs
      - name: Prepare static artifact
        run: |
          mkdir -p _site/assets _site/images _site/resume
          cp index.html robots.txt site.webmanifest _site/
          cp -R assets/css assets/js _site/assets/
          cp assets/*.svg _site/assets/
          cp -R images/. _site/images/
          cp -R resume/. _site/resume/
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4